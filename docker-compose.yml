name: lantern

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:${LANTERN_PORT}:3000"
    volumes:
      - ./src/config.toml:/app/src/config.toml:ro
      - lantern_logs:/app/logs
      - lantern_backups:/app/database-backups

